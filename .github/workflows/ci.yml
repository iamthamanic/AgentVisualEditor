name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run validate --workspace=openclaw-plugin-agent-visual-editor
        env:
          # openclaw CLI available via plugin workspace dep after npm ci
          PATH: ${{ github.workspace }}/node_modules/.bin:${{ env.PATH }}
